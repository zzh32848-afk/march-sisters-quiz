<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Which March Sister Are You?</title>
<meta name="description" content="A Little Women personality quiz: Meg, Jo, Beth or Amy?">
<meta name="theme-color" content="#5a1f10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%236b0f1a'/%3E%3Cpath d='M32 12c8 6 14 14 8 26-3 6-8 9-8 14 0-5-5-8-8-14-6-12 0-20 8-26z' fill='%23d1ac90'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Lora:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    /* palette taken from the reference */
    --moss:#4a5148; --choc:#2b1a1c; --umber:#4a2208; --burnt:#7a2e08; --burg:#6b0f1a;
    --terra:#8f4a45; --mauve:#86666a; --taupe:#a88478; --tan:#c4a080; --sand:#d1ac90;
    --ink:#2b1a1c; --muted:#7a5e58; --card:#f6eadb; --paper:#fbf3e8; --line:#e0c8ad; --gold:#a07a3a;
    --theme:#6b0f1a;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.55;min-height:100vh;
    background-color:#5e2010;
    background-image:radial-gradient(ellipse at 50% 20%,rgba(255,170,120,.10) 0,transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(20,5,5,.55) 0,transparent 70%),url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22200%22%20height%3D%22200%22%20viewBox%3D%220%200%20200%20200%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3Cpath%20id%3D%22leaf%22%20d%3D%22M0%200C-3-6-8-8-7-13C-12-13-12-19-7-20C-10-25-5-29-2-27C-1-32%201-34%200-37C1-34%201-32%202-27C5-29%2010-25%207-20C12-19%2012-13%207-13C8-8%203-6%200%200Z%22/%3E%0A%20%20%20%20%3Cg%20id%3D%22acorn%22%3E%0A%20%20%20%20%20%20%3Cellipse%20cx%3D%220%22%20cy%3D%223%22%20rx%3D%225.5%22%20ry%3D%228%22/%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M-7-3Q0-13%207-3Q0%200-7-3Z%22%20class%3D%22cap%22/%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M0-9V-13%22%20class%3D%22stem%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%20%20%3Cg%20id%3D%22branch%22%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M0%200Q24-4%2046-30%22%20class%3D%22stem%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%288%20-2%29%20rotate%28125%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%2815%20-4%29%20rotate%2825%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%2827%20-11%29%20rotate%28105%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%2833%20-16%29%20rotate%2818%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%2846%20-30%29%20rotate%2855%29%20scale%281.15%29%22/%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M17%20-4Q22%206%2019%2014%22%20class%3D%22stem%22/%3E%3Cuse%20href%3D%22%23acorn%22%20transform%3D%22translate%2819%2022%29%20scale%28.9%29%20rotate%286%29%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%20%20%3Cg%20id%3D%22motif%22%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M0%20196V60%22%20class%3D%22stem%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23branch%22%20transform%3D%22translate%280%20182%29%20scale%281.1%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23branch%22%20transform%3D%22translate%280%20182%29%20scale%28-1.1%201.1%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23branch%22%20transform%3D%22translate%280%20144%29%20scale%28.95%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23branch%22%20transform%3D%22translate%280%20144%29%20scale%28-.95%20.95%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23branch%22%20transform%3D%22translate%280%20108%29%20scale%28.8%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23branch%22%20transform%3D%22translate%280%20108%29%20scale%28-.8%20.8%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%280%2082%29%20rotate%28-22%29%20scale%28.9%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%280%2082%29%20rotate%2822%29%20scale%28.9%29%22/%3E%0A%20%20%20%20%20%20%3Cuse%20href%3D%22%23leaf%22%20transform%3D%22translate%280%2064%29%20scale%281.1%29%22/%3E%0A%20%20%20%20%3C/g%3E%0A%20%20%3C/defs%3E%0A%20%20%3Cstyle%3E%0A%20%20%20%20use%2Cellipse%7Bfill%3A%23b2522f%3Bfill-opacity%3A.42%7D%0A%20%20%20%20.stem%7Bfill%3Anone%3Bstroke%3A%23b2522f%3Bstroke-opacity%3A.45%3Bstroke-width%3A2.2%3Bstroke-linecap%3Around%7D%0A%20%20%20%20.cap%7Bfill%3A%2397401f%3Bfill-opacity%3A.65%7D%0A%20%20%3C/style%3E%0A%20%20%3Cuse%20href%3D%22%23motif%22%20x%3D%22100%22%20y%3D%220%22/%3E%0A%20%20%3Cuse%20href%3D%22%23motif%22%20x%3D%220%22%20y%3D%22100%22/%3E%3Cuse%20href%3D%22%23motif%22%20x%3D%22200%22%20y%3D%22100%22/%3E%0A%20%20%3Cuse%20href%3D%22%23motif%22%20x%3D%22100%22%20y%3D%22-200%22/%3E%3Cuse%20href%3D%22%23motif%22%20x%3D%220%22%20y%3D%22-100%22/%3E%3Cuse%20href%3D%22%23motif%22%20x%3D%22200%22%20y%3D%22-100%22/%3E%0A%3C/svg%3E%0A");
    background-size:auto,auto,200px 200px;background-attachment:fixed,fixed,scroll;
  }
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0}
  button,input{font:inherit}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #snow i{position:absolute;top:-10px;background:#fff6ea;border-radius:50%;animation:fall linear infinite}
  @keyframes fall{from{transform:translate(0,-5vh)}to{transform:translate(40px,108vh)}}

  .topbar{position:relative;z-index:3;max-width:700px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .langs{display:flex;background:rgba(43,26,28,.55);border:1px solid rgba(209,172,144,.45);border-radius:99px;padding:3px;backdrop-filter:blur(4px)}
  .langs button{border:0;background:transparent;color:#ecd6c0;padding:6px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;letter-spacing:.04em;transition:.2s}
  .langs button:hover{color:#fff}
  .langs button.on{background:var(--sand);color:var(--choc);font-weight:500}
  .mute{width:38px;height:38px;border-radius:50%;border:1px solid rgba(209,172,144,.45);background:rgba(43,26,28,.55);color:#ecd6c0;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);transition:.2s}
  .mute:hover{color:#fff}
  .mute svg{width:20px;height:20px}
  .mute .off{display:none}.mute.muted .on{display:none}.mute.muted .off{display:block}

  .wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:12px 16px 30px}
  .brand{text-align:center;color:#f0dcc6;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:24px;margin:2px 0 14px;text-shadow:0 2px 12px rgba(0,0,0,.5)}

  .card{
    background:var(--card);border-radius:20px;overflow:hidden;position:relative;
    box-shadow:0 0 0 1px rgba(255,235,210,.35) inset,0 28px 56px -24px rgba(10,0,0,.85),0 3px 0 rgba(255,225,190,.25);
    animation:rise .5s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(160,122,58,.45);border-radius:13px;pointer-events:none;z-index:2}
  .pad{padding:28px 30px 34px}

  /* title picture */
  .heroWrap{text-align:center;padding:30px 30px 0}
  .frame{display:inline-block;max-width:100%;padding:7px;background:#fff8ec;border:2px solid var(--gold);border-radius:6px;
    box-shadow:0 12px 22px -12px rgba(0,0,0,.65),0 0 0 6px var(--card),0 0 0 7px var(--gold)}
  .frame img{display:block;width:547px;max-width:100%;height:auto}

  .eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:11.5px;color:var(--muted);text-align:center}
  .title{font-size:50px;line-height:1.02;text-align:center;margin:8px 0 12px;color:var(--burg)}
  .lead{color:var(--muted);text-align:center;margin:0 auto 22px;max-width:520px}
  .name-box{max-width:380px;margin:0 auto 18px;text-align:center}
  .name-box label{display:block;font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:6px}
  .name-box input{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fffaf2;text-align:center;font-size:18px;color:var(--ink);outline:none;transition:.2s}
  .name-box input:focus{border-color:var(--terra);box-shadow:0 0 0 4px rgba(143,74,69,.18)}
  .center{text-align:center}
  .btn{background:linear-gradient(135deg,#86202f,var(--burg));color:#fff;border:0;border-radius:999px;padding:14px 34px;font-size:17px;letter-spacing:.03em;cursor:pointer;
    box-shadow:0 10px 20px -10px rgba(107,15,26,.95);transition:.2s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .btn.ghost{background:#fffaf2;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .btn.themed{background:linear-gradient(135deg,color-mix(in srgb,var(--theme) 80%,#fff),var(--theme));box-shadow:0 10px 20px -10px var(--theme)}

  /* quiz */
  .dots{display:flex;gap:6px;margin:0 0 8px;justify-content:center}
  .dots i{width:100%;max-width:44px;height:7px;border-radius:99px;background:var(--line);transition:.4s}
  .dots i.done{background:linear-gradient(90deg,var(--terra),var(--gold))}
  .dots i.now{background:var(--gold);box-shadow:0 0 0 3px rgba(160,122,58,.28)}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:13px}
  .orn{display:block;margin:0 auto 4px;width:120px;height:14px;color:var(--gold)}
  .q{font-size:32px;line-height:1.15;margin:14px 0 20px;text-align:center}
  .opts{display:grid;gap:11px}
  .opt{display:flex;gap:14px;align-items:center;text-align:left;background:#fffaf2;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--ink);cursor:pointer;
    transition:transform .15s,border-color .15s,box-shadow .15s,background .15s;animation:rise .4s ease both}
  .opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
  .opt:hover{border-color:var(--terra);transform:translateY(-2px);box-shadow:0 10px 18px -14px rgba(74,34,8,.8);background:#fffdf8}
  .opt.sel{border-color:var(--burg);background:#f7e4dc}
  .opt .let{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:17px;
    background:var(--paper);color:var(--burnt);border:1px solid var(--line);transition:.15s}
  .opt:hover .let{background:var(--burnt);color:#fff}
  .dbg{display:block;font-size:11.5px;color:var(--terra);margin-top:2px}
  .nav{margin-top:16px;display:flex;justify-content:space-between}
  .linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:14px;cursor:pointer}
  .linkbtn[disabled]{opacity:.3;cursor:default;text-decoration:none}
  .hidden{display:none}

  /* result */
  .res-top{padding:30px 20px 76px;text-align:center;color:#fff;position:relative;overflow:hidden;
    background:radial-gradient(circle at 20% 5%,rgba(255,235,210,.28) 0,transparent 42%),linear-gradient(160deg,color-mix(in srgb,var(--theme) 88%,#fff),color-mix(in srgb,var(--theme) 55%,#120609))}
  .res-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:44px;background:var(--card);border-radius:50% 50% 0 0/100% 100% 0 0}
  .res-top .pet{position:absolute;inset:0;pointer-events:none}
  .res-top .pet i{position:absolute;top:-20px;width:9px;height:9px;border-radius:50% 0 50% 0;background:rgba(255,240,220,.55);animation:fall linear infinite}
  .hello{font-family:'Pinyon Script',cursive;font-size:30px;margin:0 0 6px;position:relative}
  .hello.alt{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:27px}
  .portrait{width:178px;height:178px;margin:4px auto 8px;position:relative;border-radius:50%;padding:5px;
    background:linear-gradient(135deg,#f3d99a,#a07a3a 55%,#f3d99a);box-shadow:0 14px 24px -8px rgba(0,0,0,.55);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
  .portrait img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff8ec}
  @keyframes pop{from{transform:scale(.3) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
  .res-name{font-size:68px;line-height:1;margin:6px 0 0;position:relative;text-shadow:0 4px 18px rgba(0,0,0,.35)}
  .tag{font-style:italic;font-family:'Cormorant Garamond',serif;font-size:23px;margin:2px 0 0;position:relative;opacity:.96}
  .res-body{padding:4px 30px 34px}
  .traits{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;padding:0;list-style:none;justify-content:center}
  .traits li{border-radius:99px;padding:4px 14px;font-size:14px;color:var(--theme);background:color-mix(in srgb,var(--theme) 9%,#fff);border:1px solid color-mix(in srgb,var(--theme) 35%,#fff)}
  .bars{margin:24px 0 8px;display:grid;gap:12px}
  .bar-row{display:grid;grid-template-columns:38px 56px 1fr 46px;gap:10px;align-items:center;font-size:15px}
  .bar-row img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
  .bar{height:13px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .pct{text-align:right;font-variant-numeric:tabular-nums}
  .second{color:var(--muted);font-size:14.5px;text-align:center;margin:8px 0 0}
  details{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:14px}
  summary{cursor:pointer;color:var(--ink)}
  table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}
  td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center}
  th:first-child,td:first-child{text-align:left}
  .actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .foot{position:relative;z-index:1;text-align:center;font-size:12.5px;color:#f0dcc6;padding:0 16px 30px;max-width:700px;margin:0 auto}
  .foot span{display:inline-block;background:rgba(43,26,28,.6);padding:6px 14px;border-radius:14px}
  @media(max-width:540px){
    .title{font-size:39px}.q{font-size:26px}.pad{padding:22px 18px 28px}.res-body{padding:4px 18px 28px}.heroWrap{padding:24px 18px 0}
    .res-name{font-size:56px}.bar-row{grid-template-columns:34px 48px 1fr 42px;gap:8px}.bar-row img{width:34px;height:34px}
    .langs button{padding:6px 11px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>

<div class="topbar">
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en" class="on">EN</button><button data-lang="ru">РУ</button><button data-lang="kk">ҚАЗ</button>
  </div>
  <button class="mute" id="mute" type="button" aria-label="Sound">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</div>

<div class="wrap">
  <div class="brand" data-i="brand"></div>

/* Build options with explicit point values */
const TEST = QUESTIONS.map((item, qi) => {
  const pair = PAIRINGS[qi % PAIRINGS.length];
  return {
    q: item.q,
    options: KEYS.map(k => ({
      text: item.o[k],
      points: {[k]: PRIMARY, [pair[k]]: SECONDARY},   // e.g. {M:3, B:1}
      primary: k
    }))
  };
});
const MAX_TOTAL = TEST.length * (PRIMARY + SECONDARY);   // 40

/* Pure scoring function (answers = array of chosen option objects) */
function score(answers){
  const totals = {M:0,J:0,B:0,A:0}, primaries = {M:0,J:0,B:0,A:0};
  answers.forEach(opt => {
    for (const k in opt.points) totals[k] += opt.points[k];
    primaries[opt.primary]++;
  });
  const lastPrimary = answers.length ? answers[answers.length-1].primary : null;
  // Rank: total points -> number of primary picks -> last answer -> fixed order
  const ranked = KEYS.slice().sort((a,b) =>
    (totals[b]-totals[a]) ||
    (primaries[b]-primaries[a]) ||
    ((b===lastPrimary)-(a===lastPrimary)) ||
    (KEYS.indexOf(a)-KEYS.indexOf(b)));
  return {totals, primaries, ranked};
}

/* Percentages that always add up to exactly 100 (largest remainder) */
function percentages(totals){
  const raw = KEYS.map(k => totals[k]/MAX_TOTAL*100);
  const floors = raw.map(Math.floor);
  let left = 100 - floors.reduce((a,b)=>a+b,0);
  raw.map((v,i)=>[v-floors[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){floors[i]++;left--;} });
  const out = {}; KEYS.forEach((k,i)=>out[k]=floors[i]); return out;
}

let ac = null, muted = false;

function audio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume();
  return ac;
}
function tone(freq, t0, dur, type, vol){
  const c = audio(); if(!c || muted) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}

  document.documentElement.lang = lang;
  document.title = T('title') + ' | Little Women';
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  document.querySelectorAll('[data-ialt]').forEach(el => el.alt = T(el.dataset.ialt));
  document.querySelectorAll('[data-iph]').forEach(el => el.placeholder = T(el.dataset.iph));
  $('mute').setAttribute('aria-label', T('sound'));
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lang===lang));
}

function setLang(l){
  lang = l; try{ localStorage.setItem('marchLang', l); }catch(e){}
  applyStatic();
  if (view==='quiz') render();
  if (view==='result' && last) renderResult(false);
}

function start(){
  userName = $('name').value.trim();           // kept only in memory, never stored or sent anywhere
  audio(); sfxStart();
  order = TEST.map(t => shuffle(t.options));   // answer order is shuffled so position never biases the result
  current = 0; answers = [];
  $('dots').innerHTML = TEST.map(()=>'<i></i>').join('');
  show('quiz'); render();
}

function render(){
  const t = TEST[current];
  $('qtext').textContent = t.q[lang];
  $('counter').textContent = fmt(T('qOf'), {n:current+1, m:TEST.length});
  $('who').textContent = userName ? fmt(T('forWho'), {name:userName}) : '';
  [...$('dots').children].forEach((d,i)=>{ d.className = i<current ? 'done' : i===current ? 'now' : ''; });
  $('back').disabled = current===0;
  const box = $('opts'); box.innerHTML = '';
  order[current].forEach((opt,i) => {
    const b = document.createElement('button');
    b.className = 'opt' + (answers[current]===opt ? ' sel' : '');
    const l = document.createElement('span'); l.className='let'; l.textContent = 'abcd'[i];
    const s = document.createElement('span'); s.textContent = opt.text[lang];
    if (DEBUG){
      const d = document.createElement('small'); d.className='dbg';
      d.textContent = Object.entries(opt.points).map(([k,v])=>`${SISTERS[k].name.en} +${v}`).join(' · ');
      s.appendChild(d);
    }
    b.append(l, s);
    b.onclick = () => choose(opt);
    box.appendChild(b);
  });
}

function choose(opt){
  answers[current] = opt;
  if (current < TEST.length-1){ sfxPick(); current++; render(); }
  else finish();
}

function finish(){
  const r = score(answers);
  last = {...r, pct: percentages(r.totals)};
  show('result'); renderResult(true);
}

function renderResult(withSound){
  const {totals, primaries, ranked, pct} = last;
  const wk = ranked[0], win = SISTERS[wk], second = SISTERS[ranked[1]];
  const rows = ranked.map(k => `
    <div class="bar-row"><img src="${PORTRAITS[k]}" alt=""><b>${SISTERS[k].name[lang]}</b>
      <div class="bar"><i data-w="${pct[k]}" style="background:${SISTERS[k].color}"></i></div>
      <span class="pct">${pct[k]}%</span></div>`).join('');
  const detail = KEYS.map(k => `<tr><td>${SISTERS[k].name[lang]}</td><td>${primaries[k]}</td><td>${totals[k]}</td><td>${totals[k]} / ${MAX_TOTAL}</td></tr>`).join('');
  const close = totals[ranked[0]] - totals[ranked[1]] <= 3;
  const th = T('th');

  const r = $('result');
  r.style.setProperty('--theme', win.color);
  r.innerHTML = `
    <div class="res-top">
      <div class="pet" id="pet"></div>
      <p class="hello${lang==='en'?'':' alt'}" id="hello"></p>
      <div class="portrait"><img src="${PORTRAITS[wk]}" alt="${win.name[lang]}"></div>
      <h2 class="res-name">${win.name[lang]}</h2>
      <p class="tag">${win.tagline[lang]}</p>
    </div>
    <div class="res-body">
      <p>${win.text[lang]}</p>
      <ul class="traits">${win.traits[lang].map(t=>`<li>${t}</li>`).join('')}</ul>
      <div class="bars">${rows}</div>
      <p class="second">${close ? fmt(T('close'),{s:second.name[lang]}) : fmt(T('second'),{s:second.name[lang]})}</p>
      <details><summary>${T('how')}</summary>
        <p>${fmt(T('calc'),{max:MAX_TOTAL})}</p>
        <table><tr><th>${th[0]}</th><th>${th[1]}</th><th>${th[2]}</th><th>${th[3]}</th></tr>${detail}</table>
      </details>
      <div class="actions"><button class="btn themed" id="copy">${T('copy')}</button><button class="btn ghost" id="again">${T('again')}</button></div>
    </div>`;
  $('hello').textContent = userName ? fmt(T('youAreNamed'),{name:userName}) : T('youAre');
  const pet = $('pet');
  for (let i=0;i<14;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.animationDuration=(6+Math.random()*6)+'s'; p.style.animationDelay=(-Math.random()*8)+'s'; pet.appendChild(p); }
  $('again').onclick = () => { audio(); sfxStart(); show('intro'); };
  $('copy').onclick = async () => {
    const txt = (userName ? fmt(T('shareNamed'),{name:userName,s:win.name[lang]}) : fmt(T('share'),{s:win.name[lang]}))
      + ' (' + ranked.map(k=>`${SISTERS[k].name[lang]} ${pct[k]}%`).join(', ') + ')';
    let ok = false;
    try { await navigator.clipboard.writeText(txt); ok = true; } catch(e){}
    $('copy').textContent = ok ? T('copied') : txt;
  };
  if (withSound) sfxResult();
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('.bar>i').forEach(el => el.style.width = el.dataset.w+'%');
  },80));
}

/* ---------------- init ---------------- */
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
function paintMute(){ $('mute').classList.toggle('muted', muted); }
$('mute').onclick = () => { muted = !muted; try{ localStorage.setItem('marchMuted', muted?'1':'0'); }catch(e){} paintMute(); if(!muted){ audio(); sfxPick(); } };
paintMute();
$('start').onclick = start;
$('name').addEventListener('keydown', e => { if(e.key==='Enter') start(); });
$('back').onclick = () => { if(current>0){ current--; render(); } };
applyStatic();
(function snow(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const f = $('snow');
  for (let i=0;i<26;i++){
    const s = document.createElement('i'), z = 2 + Math.random()*4;
    s.style.cssText = `left:${Math.random()*100}%;width:${z}px;height:${z}px;opacity:${.25+Math.random()*.4};animation-duration:${10+Math.random()*10}s;animation-delay:${-Math.random()*16}s`;
    f.appendChild(s);
  }
})();
</script>
</body>
</html>
